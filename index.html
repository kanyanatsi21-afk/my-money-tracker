
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดเงินของฉัน</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f6fc;color:#24324a;margin:0;padding:18px}
main{max-width:520px;margin:auto}
h1{text-align:center;color:#2857a4}
.card{background:white;border-radius:16px;padding:16px;margin:16px 0;box-shadow:0 2px 10px #0001}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#edf3ff;border-radius:10px;padding:12px}
small{color:#68758b}
.amount{font-size:20px;font-weight:bold;margin-top:8px;overflow-wrap:anywhere}
input,select,button{width:100%;padding:12px;margin-top:7px;margin-bottom:10px;border:1px solid #ccd5e3;border-radius:9px;box-sizing:border-box;font-size:16px}
button{background:#3267d5;color:white;border:0;font-weight:bold}
.green{color:#13835b}.red{color:#d33}
.entry{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px}
.entry button{width:auto;padding:7px 10px;background:#ffeaea;color:#b22;font-size:13px}
</style>
</head>
<body>
<main>
<h1>💰 สมุดเงินของฉัน</h1>
<p style="text-align:center">บันทึกรายรับ รายจ่ายในแต่ละวัน</p>

<div class="card">
<div class="stats">
<div class="stat"><small>รายรับ</small><div id="income" class="amount green">฿0</div></div>
<div class="stat"><small>รายจ่าย</small><div id="expense" class="amount red">฿0</div></div>
</div>
<div class="stat" style="margin-top:10px"><small>เงินคงเหลือ</small><div id="balance" class="amount">฿0</div></div>
</div>

<div class="card">
<h3>➕ เพิ่มรายการ</h3>
<form id="form">
<label>ประเภท</label>
<select id="type"><option value="income">รายรับ</option><option value="expense">รายจ่าย</option></select>
<label>จำนวนเงิน (บาท)</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="เช่น 150" required>
<label>รายละเอียด</label>
<input id="note" placeholder="เช่น ขายของ หรือ ค่าอาหาร" required>
<label>วันที่</label>
<input id="date" type="date" required>
<button type="submit">บันทึกรายการ</button>
</form>
</div>

<div class="card">
<h3>📒 รายการย้อนหลัง</h3>
<div id="list">ยังไม่มีรายการ</div>
</div>
</main>

<script>
const el=id=>document.getElementById(id);
const key='myMoneyRecords';
let records=[];
try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}
el('date').value=new Date().toLocaleDateString('sv-SE');

function money(n){return '฿'+n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}

function render(){
const income=records.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
const expense=records.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
el('income').textContent=money(income);
el('expense').textContent=money(expense);
el('balance').textContent=money(income-expense);
el('list').replaceChildren();
if(records.length===0){el('list').textContent='ยังไม่มีรายการ';return}
records.slice().reverse().forEach(r=>{
const row=document.createElement('div');
row.className='entry';
const info=document.createElement('div');
const name=document.createElement('strong');
name.textContent=r.note;
const date=document.createElement('div');
date.textContent=r.date+' · '+(r.type==='income'?'รายรับ':'รายจ่าย');
date.style.fontSize='12px';
date.style.color='#68758b';
info.append(name,date);
const right=document.createElement('div');
right.style.textAlign='right';
const amt=document.createElement('div');
amt.className='amount '+(r.type==='income'?'green':'red');
amt.style.fontSize='16px';
amt.textContent=(r.type==='income'?'+':'−')+money(r.amount);
const del=document.createElement('button');
del.type='button';
del.textContent='ลบ';
del.onclick=()=>{records=records.filter(x=>x.id!==r.id);save()};
right.append(amt,del);
row.append(info,right);
el('list').append(row);
});
}

function save(){
try{localStorage.setItem(key,JSON.stringify(records));render()}
catch(e){alert('บันทึกไม่ได้ กรุณาลองเปิดเว็บใน Safari อีกครั้ง')}
}

el('form').addEventListener('submit',e=>{
e.preventDefault();
const amount=Number(el('amount').value);
const note=el('note').value.trim();
if(amount<=0||!note){alert('กรุณากรอกข้อมูลให้ครบ');return}
records.push({id:Date.now(),type:el('type').value,amount,note,date:el('date').value});
save();
el('amount').value='';
el('note').value='';
alert('บันทึกเรียบร้อยค่ะ');
});
render();
</script>
</body>
</html>
